# Revisao manual exploratoria. Nenhuma destas decisoes altera o baseline oficial.
# Um alerta nao listado permanece pendente, mesmo quando cai num marcador.
regras_candidatas:
  noSqlReviewsChallenge: [tcc.mongodb.security.untrusted-id-multi-update]
  forgedReviewChallenge: [tcc.mongodb.security.untrusted-id-multi-update]
  redirectChallenge: [tcc.redirect.security.substring-allowlist]
  restfulXssChallenge: [tcc.angular.security.bypass-security-trust-html]
  localXssChallenge: [tcc.angular.security.bypass-security-trust-html]
  xssBonusChallenge: [tcc.angular.security.bypass-security-trust-html]

triagem:
  - regra: javascript.sequelize.security.audit.sequelize-injection-express.express-sequelize-injection
    arquivo: routes/login.ts
    linha: 34
    status: confirmado
    desafios: [loginAdminChallenge, loginBenderChallenge, loginJimChallenge]
    motivo: Consulta SQL monta a clausula WHERE com email controlado pela requisicao.
  - regra: javascript.express.security.injection.tainted-sql-string.tainted-sql-string
    arquivo: routes/login.ts
    linha: 34
    status: confirmado
    desafios: [loginAdminChallenge, loginBenderChallenge, loginJimChallenge]
    motivo: Mesmo ponto de SQL injection, reportado por segunda regra.
  - regra: javascript.sequelize.security.audit.sequelize-injection-express.express-sequelize-injection
    arquivo: routes/search.ts
    linha: 23
    status: confirmado
    desafios: [unionSqlInjectionChallenge, dbSchemaChallenge]
    motivo: Consulta SQL interpola criterios de busca sem parametrizacao.
  - regra: javascript.express.security.injection.tainted-sql-string.tainted-sql-string
    arquivo: routes/search.ts
    linha: 23
    status: confirmado
    desafios: [unionSqlInjectionChallenge, dbSchemaChallenge]
    motivo: Mesmo ponto de SQL injection, reportado por segunda regra.
  - regra: javascript.express.security.audit.express-check-directory-listing.express-check-directory-listing
    arquivo: server.ts
    linha: 269
    status: confirmado
    desafios: [directoryListingChallenge]
    motivo: Middleware publica listagem do diretorio FTP.
  - regra: javascript.express.security.audit.express-check-directory-listing.express-check-directory-listing
    arquivo: server.ts
    linha: 281
    status: confirmado
    desafios: [accessLogDisclosureChallenge]
    motivo: Middleware publica listagem dos logs de acesso.
  - regra: tcc.angular.security.bypass-security-trust-html
    arquivo: frontend/src/app/search-result/search-result.component.ts
    linha: 110
    status: confirmado
    desafios: [restfulXssChallenge]
    motivo: Descricao de produto exibida como HTML confiavel sem sanitizacao.
  - regra: tcc.angular.security.bypass-security-trust-html
    arquivo: frontend/src/app/search-result/search-result.component.ts
    linha: 143
    status: confirmado
    desafios: [localXssChallenge, xssBonusChallenge]
    motivo: Query param q inserido como HTML confiavel sem sanitizacao.
  - regra: tcc.mongodb.security.untrusted-id-multi-update
    arquivo: routes/updateProductReviews.ts
    linha: 17
    status: confirmado
    desafios: [noSqlReviewsChallenge]
    motivo: Seletor _id recebe valor bruto da requisicao e a operacao permite multi true; nao comprova sozinho o defeito de autorizacao do desafio Forged Review.
  - regra: tcc.redirect.security.substring-allowlist
    arquivo: lib/insecurity.ts
    linha: 135
    status: confirmado
    desafios: [redirectChallenge]
    motivo: URL candidata e aceita quando apenas contem uma URL permitida como substring.
  - regra: javascript.browser.security.eval-detected.eval-detected
    arquivo: routes/captcha.ts
    linha: 22
    status: falso_positivo
    desafios: []
    motivo: Expressao e formada por numeros aleatorios e operadores fixos, sem entrada controlada pelo usuario.
  - regra: javascript.express.security.audit.xss.pug.explicit-unescape.template-explicit-unescape
    arquivo: views/promotionVideo.pug
    linha: 75
    status: falso_positivo
    desafios: []
    motivo: A regra interpreta o operador JavaScript != como interpolacao Pug !=.
  - regra: generic.secrets.security.detected-generic-secret.detected-generic-secret
    arquivo: data/static/users.yml
    linha: 151
    status: confirmado
    desafios: []
    motivo: O arquivo de dados de inicializacao contem um segredo TOTP de conta administrativa em texto claro; nao foi associado automaticamente a um desafio especifico.
  - regra: tcc.angular.security.bypass-security-trust-html
    arquivo: frontend/src/app/about/about.component.ts
    linha: 119
    status: confirmado
    desafios: [persistedXssFeedbackChallenge]
    sem_marcador: true
    motivo: O payload do teste oficial <<script>Foo</script>iframe... vira iframe perigoso com sanitize-html 1.4.2; o comentario persistido e exibido como HTML confiavel na pagina About.
  - regra: tcc.angular.security.bypass-security-trust-html
    arquivo: frontend/src/app/administration/administration.component.ts
    linha: 73
    status: confirmado
    desafios: [persistedXssUserChallenge]
    sem_marcador: true
    motivo: O email persistido nao e sanitizado quando o desafio esta habilitado e e inserido em HTML confiavel na pagina administrativa.
