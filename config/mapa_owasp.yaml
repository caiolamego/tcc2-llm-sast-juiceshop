# Mapeamento OWASP Top 10 2021 -> 2025 (Decisao D7 do guia).
# Fonte: OWASP Top 10:2025 (https://top10.owasp.org/2025/), publicado em
# 2025. O Semgrep (regras p/owasp-top-ten) rotula findings na numeracao
# 2021 -- esta tabela traduz para a numeracao 2025 usada no referencial
# teorico do TCC. Confirmar a URL exata na bibliografia da monografia.
#
# Mudancas 2021 -> 2025 que valem registrar no texto:
#   - A10:2021 (SSRF) deixou de existir como categoria propria: foi
#     absorvida por A01:2025 (Broken Access Control).
#   - A06:2021 (Vulnerable and Outdated Components) virou A03:2025
#     (Software Supply Chain Failures) -- fora do escopo do TCC (M1 do
#     Adendo), mas mapeado aqui por completude.
#   - A10:2025 (Mishandling of Exceptional Conditions) e categoria nova,
#     sem equivalente em 2021 -- nao aparece nesta tabela de origem.

"A01:2021": "A01"   # Broken Access Control -> Broken Access Control (absorve SSRF)
"A02:2021": "A04"   # Cryptographic Failures -> Cryptographic Failures
"A03:2021": "A05"   # Injection -> Injection
"A04:2021": "A06"   # Insecure Design -> Insecure Design
"A05:2021": "A02"   # Security Misconfiguration -> Security Misconfiguration
"A06:2021": "A03"   # Vulnerable and Outdated Components -> Software Supply Chain Failures
"A07:2021": "A07"   # Identification and Authentication Failures -> Authentication Failures
"A08:2021": "A08"   # Software and Data Integrity Failures -> Software or Data Integrity Failures
"A09:2021": "A09"   # Security Logging and Monitoring Failures -> Security Logging and Alerting Failures
"A10:2021": "A01"   # Server-Side Request Forgery -> absorvido em Broken Access Control

# Nomes completos 2025, para referencia (nao usados pelo codigo):
# A01 Broken Access Control
# A02 Security Misconfiguration
# A03 Software Supply Chain Failures
# A04 Cryptographic Failures
# A05 Injection
# A06 Insecure Design
# A07 Authentication Failures
# A08 Software or Data Integrity Failures
# A09 Security Logging & Alerting Failures
# A10 Mishandling of Exceptional Conditions