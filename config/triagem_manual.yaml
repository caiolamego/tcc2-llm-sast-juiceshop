# Triagem manual dos alertas do Semgrep (campo triagem_manual do catalogo).
# Valores: confirmado | falso_positivo | inconclusivo. Alerta do catalogo sem
# entrada aqui recebe nao_triado.
#
# A triagem NAO exclui nenhum caso: todos os elegiveis vao a execucao (Secao 3.4
# do TCC 1). Serve para reportar os falsos positivos a parte nas metricas
# (protocolo, Secao 3, passo 7; decisao do grupo, 2026-10-13).
#
# Origem: revisao manual de Matheus Brant na branch semgrep-findings, commit
# fa044444abe4feb7b53dbf88859c99a45e089352. Unificacao de dois arquivos dela,
# sem conflito de status entre eles:
#   config/auditoria_desafios.yaml (fonte: auditoria_desafios; 5 rulesets
#     originais, p/default e p/security-audit)
#   outputs/auditoria_sast/combinado-hZGD7r/triagem-final/alertas_classificados.json
#     (fonte: triagem_final; p/default e regras locais; prevalece se repetir)
# Ficaram de fora as regras locais tcc.* (nao fazem parte dos rulesets) e os
# alertas fora de escopo. Chave: (check_id, arquivo, linha de inicio).
