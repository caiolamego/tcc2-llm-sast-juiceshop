rules:
  - id: tcc.auth.security.optional-current-password
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      A comparacao com a senha armazenada so ocorre quando o valor atual foi
      informado. Verifique se a ausencia desse valor impede a troca de senha.
    metadata:
      category: security
      cwe: ['CWE-620: Unverified Password Change']
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: |
              if ($CURRENT && $HASH($CURRENT) !== $ACCOUNT.password) { ... }
          - pattern: |
              if ($CURRENT && $HASH($CURRENT) != $ACCOUNT.password) { ... }
